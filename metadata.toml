citation = "@inproceedings{eichhorn2026scales,\n    author = {Eichhorn, Maximilian and Minuth, Christian and Freiling, Felix},\n    title = {Scaling Up: {IoT} Ecosystem Forensics via Coupled State Machines, Applied to Smart Scales},\n    booktitle = {Proceedings of the Annual Computer Security Applications Conference (ACSAC)},\n    publisher = {IEEE},\n    year = {2026}\n}"
license_url = "https://github.com/mxchhrn/smart-scales/blob/main/LICENSE"
infrastructure_constraints = "No special infrastructure needed. A common x86-64 Linux VM (2 GB RAM, ~2 GB disk storage) should be sufficient. We include anonymized flash dumps and companion app databases to avoid hardware requirements, cloud access or network connections."
infrastructure_access = ""
install_script = "https://github.com/mxchhrn/smart-scales/blob/main/install.sh"
use = "The optional EufyLife Realm export script (scripts/) requires Chrome DevTools and is NOT needed to reproduce any result in the paper. For the used Eufy evidence we provide the plain-SQLite EufyLifeDb.db database. Furthermore, we include captures and outputs for the documentation of the reported credential vulnerabilities. These are not intended for live reproduction (see ETHICS.md)."
destructive = "None. The scripts operate on the included data read-only and only produce some output files."
claim1 = "The factory reset as state transition sigma_14 triggers no ecosystem-wide data sanitization. S1: NVS key-value entries survive intact. S2: Wi-Fi credentials survive in sta.apinfo. S3: device flash is restored to factory state. S1-S3: Companion app and cloud measurement data survive the reset (see paper Section on sanitization asymmetry)."
script1 = "https://github.com/mxchhrn/smart-scales/blob/main/claims/claim1_sanitization.sh"
expected1 = "Differences between the flash dumps and companion app data of the states q13, q14 and q15. S1: NVS entries unchanged; S2: sta.apinfo still present with data; S3: device flash fully restored to factory state; per-app measurement tables intact across sigma_14."
claim2 = "The forensic artifacts reported for the device layer are recoverable from the included flash dumps. Artifacts: Wi-Fi credentials, MACs, cloud endpoints and the NVS token entries from S1 and S2 (key names and entry structure are original; the S2 cloud token value is a same-length [redacted] placeholder, see PROVENANCE.md). S3: most recent per-user measurement record."
script2 = "https://github.com/mxchhrn/smart-scales/blob/main/claims/claim2_flash_artifacts.sh"
expected2 = "Forensic artifacts listed in the JSON output files of TEAID for the dumps of the internal storage of the different scales."
claim3 = "The database oversea.db in the companion app data from Feelfit (S1) is decryptable with the hard-coded SQLCipher key extractable with strings."
script3 = "https://github.com/mxchhrn/smart-scales/blob/main/claims/claim3_feelfit_decrypt.sh"
expected3 = "sqlcipher with the extracted key (via strings) decrypts oversea.db. After decryption the measurement history is readable in the database."
claim4 = "All 13 artifact categories appear in at least one layer of every ecosystem (evidence redundancy, paper coverage table)."
script4 = "https://github.com/mxchhrn/smart-scales/blob/main/claims/claim4_coverage.sh"
expected4 = "The output of TEAID regarding the companion app data reproduces forensic artifacts of the listed categories and the per-category matrix in the paper can be recreated."
hw = "x86-64 Linux VM (2 GB RAM, ~2 GB disk storage). No GPU or special hardware."
sw = "Linux with SQLCipher 4 (Ubuntu 24.04, Debian 12 or newer), Python >= 3.10, pip, sqlcipher, libsqlcipher-dev, libleveldb-dev, sqlite3, build-essential, curl, coreutils"
api = "No API keys or access needed."
gui = "n"
provenance = "https://github.com/mxchhrn/smart-scales/blob/main/PROVENANCE.md"
ethics = "https://github.com/mxchhrn/smart-scales/blob/main/ETHICS.md"
